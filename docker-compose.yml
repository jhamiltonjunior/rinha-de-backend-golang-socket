x-rinha-api-base: &rinha-api-base
  # image: jhamiltonjunior/rinha-go-redis:0.0.1
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - api-sockets:/tmp
  depends_on:
    - redis
  networks:
    - app-network
    - payment-processor
  # deploy:
  #   resources:
  #     limits:
  #       cpus: "0.375"
  #       memory: "60MB"
  environment: &common-environment
    APP_PORT: 3000
    REDIS_ADDR: redis:6379
    POSTGRES_URL: postgres://user:password-very-har@postgres:5432/rinha_de_backend?sslmode=disable
    NATS_URL: nats://nats:4222
    PAYMENT_PROCESSOR_URL_DEFAULT: http://payment-processor-default:8080
    PAYMENT_PROCESSOR_URL_FALLBACK: http://payment-processor-fallback:8080

services:
  nginx:
    image: haproxy:3.2.3-alpine
    # image: nginx:alpine
    # pull_policy: always
    container_name: nginx_load_balancer
    ports:
      - "9999:80"
    volumes:
      # - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - api-sockets:/tmp:rw
    depends_on:
      - rinha-api-1
      - rinha-api-2
      - rinha-api-3
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "20MB"

  rinha-api-1:
    <<: *rinha-api-base
    container_name: rinha-api-1
    environment:
      <<: *common-environment
      RUN_VERIFY_PAYMENT_SERVICE: "true"
      UNIX_SOCKET: /tmp/api_1.sock
    command: ./main -socket /tmp/api_1.sock

  rinha-api-2:
    <<: *rinha-api-base
    container_name: rinha-api-2
    environment:
      <<: *common-environment
      UNIX_SOCKET: /tmp/api_2.sock
    command: ./main -socket /tmp/api_2.sock

  rinha-api-3:
    <<: *rinha-api-base
    container_name: rinha-api-3
    environment:
      <<: *common-environment
      UNIX_SOCKET: /tmp/api_3.sock
    command: ./main -socket /tmp/api_3.sock

  rinha-api-4:
    <<: *rinha-api-base
    container_name: rinha-api-4
    environment:
      <<: *common-environment
      UNIX_SOCKET: /tmp/api_4.sock
    command: ./main -socket /tmp/api_4.sock

  redis:
    # image: docker.dragonflydb.io/dragonflydb/dragonfly 
    image: redis:7.2.4-alpine
    container_name: redis_cache
    networks:
      - app-network
    volumes:
      - redis-data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - app-network

  nats:
    image: nats:2.10.14-alpine
    container_name: nats_server
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    networks:
      - app-network

  # wrk:
  #   image: williamyeh/wrk
  #   container_name: wrk_benchmark
  #   volumes:
  #     - ./scripts:/scripts:ro
  #     - api-sockets:/tmp
  #   entrypoint: ["sleep", "1000000000"]
  #   networks:
  #     - app-network


networks:
  app-network:
    name: app-network
    driver: bridge
  payment-processor:
    external: true

volumes:
  redis-data:
  api-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=1777
