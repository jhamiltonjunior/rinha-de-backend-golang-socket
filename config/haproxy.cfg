global
    maxconn 4096
    # log 127.0.0.1 local0

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    bind *:80
    default_backend app

backend app
    server app1 rinha-api-1:3000 maxconn 1024
    server app2 rinha-api-2:3000 maxconn 1024
    server app3 rinha-api-3:3000 maxconn 1024
    # server app4 rinha-api-4:3000 maxconn 1024
